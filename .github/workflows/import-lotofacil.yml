name: Import Lotofácil (diário)

# Busca concursos novos da Caixa e commita as atualizações no
# public/concursos.json + data/concursos.json.
#
# Trigger: diariamente 21:00 UTC (18:00 BRT — 30min após sorteio típico)
# Também disparável manualmente via botão "Run workflow" no GitHub UI.

on:
  schedule:
    - cron: "0 21 * * *"  # daily 21:00 UTC
  workflow_dispatch:
    inputs:
      max:
        description: "Máximo de concursos a importar (default 30)"
        default: "30"
        required: false

permissions:
  contents: write

concurrency:
  group: import-lotofacil
  cancel-in-progress: false  # não cancela import em curso

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          # Precisamos de write, e commit vai pra main
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # versão vem do "packageManager" do package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import concursos novos
        working-directory: apps/lotoai-mobile
        env:
          MAX: ${{ inputs.max || '30' }}
        run: node scripts/import-from-caixa.mjs --max=$MAX

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet apps/lotoai-mobile/data/concursos.json apps/lotoai-mobile/public/concursos.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nenhum concurso novo — nada a commitar"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            # Extrai último concurso do JSON pra usar na msg
            LAST=$(node -e "const a=require('./apps/lotoai-mobile/data/concursos.json');console.log(a[a.length-1].numero)")
            COUNT=$(node -e "const a=require('./apps/lotoai-mobile/data/concursos.json');console.log(a.length)")
            echo "last=$LAST" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Commit + push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/lotoai-mobile/data/concursos.json apps/lotoai-mobile/public/concursos.json
          git commit -m "data(lotoai): import automático até #${{ steps.diff.outputs.last }}

          Total: ${{ steps.diff.outputs.count }} concursos.
          Auto-triggered pelo cron diário."
          git push origin main

      - name: Sincronizar com branch de dev
        if: steps.diff.outputs.changed == 'true'
        run: |
          git fetch origin claude/lotoai-app-pro-mobile-8AiS8
          git checkout claude/lotoai-app-pro-mobile-8AiS8
          git checkout main -- apps/lotoai-mobile/data/concursos.json apps/lotoai-mobile/public/concursos.json
          if ! git diff --quiet; then
            git add apps/lotoai-mobile/data/concursos.json apps/lotoai-mobile/public/concursos.json
            git commit -m "data(lotoai): sync concursos até #${{ steps.diff.outputs.last }} de main"
            git push origin claude/lotoai-app-pro-mobile-8AiS8
          fi
